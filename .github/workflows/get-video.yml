name: Get video

on:
  push:
    paths:
      - ".github/workflows/get-video.yml"
      - "video/video-requests.txt"
      - "video/script.py"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: FedericoCarboni/setup-ffmpeg@v2
        id: setup-ffmpeg
      - name: Install yt-dlp
        run: |
          mkdir private
          cd private
          mkdir tools
          cd tools
          
          gh release download 2023.03.04 -R yt-dlp/yt-dlp -p 'yt-dlp_linux'
          mv yt-dlp_linux yt-dlp
          chmod +x yt-dlp
          file yt-dlp
          
          pwd >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download and trim
        run: python script.py
        working-directory: video
        shell: bash

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: video
          path: |
            video
          retention-days: 3