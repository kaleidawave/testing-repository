name: Testing things

on: { push: { paths: [".github/workflows/push.yml", "one-off/**/*"] } }

jobs:
  download-crates-release-and-create-a-release-with-it:
    runs-on: ubuntu-latest

    permissions: { contents: write }

    steps:
      - uses: actions/checkout@v6
        with: { ref: unmain }

      - uses: kaleidawave/release-downloader@improvements
        env: { GH_TOKEN: "${{ github.token }}" }
        with: { items: 'kaleidawave/crates-release-gh-action@assets[crates-release]' }
        
      - run: crates-release --help

      - name: Create release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          tag="my-tag"
          ref="unmain"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # git add -u
          # --allow-empty temp for this crate
          git commit -m "example release '$tag'" --allow-empty
          git tag -a $tag -m "example release"
          git push origin unmain
          git push origin tag $tag

          gh release create $tag --target $ref -t "test release"
          gh release upload $tag "$(which crates-release)#crates-release-unix" --clobber

  generate-treesitter-language:
    if: false
    runs-on: macos-latest

    steps:
      - name: clone, build, inspect
        shell: bash
        run: |
          url='https://github.com/tree-sitter/tree-sitter-rust'
          # get the part after the last '-' in the URL
          language=${url##*-}

          git clone "$url.git" .

          cd ${{ null || '.' }}

          clang --version

          if [ ! -f src/scanner.c ]; then
            clang -dynamiclib -o "libtree-sitter-$language.dylib" src/parser.c -Isrc -fPIC "-Wl,-exported_symbol,_tree_sitter_$language"
          else
            clang -dynamiclib -o "libtree-sitter-$language.dylib" src/parser.c src/scanner.c -Isrc -fPIC "-Wl,-exported_symbol,_tree_sitter_$language"
          fi
    
  download-tree-sitter:
    if: false

    runs-on: ubuntu-latest
    steps:
      - uses: kaleidawave/release-downloader@improvements
        env: { GH_TOKEN: "${{ github.token }}" }
        with: { items: 'tree-sitter/tree-sitter@v0.25.10' }

      - run: tree-sitter --help

  comparse-ezno-and-typescript:
    if: false

    runs-on: ubuntu-latest

    steps:
      - uses: kaleidawave/release-downloader@improvements
        env: { GH_TOKEN: "${{ github.token }}" }
        with: { items: 'kaleidawave/experiments@assets[shell-language],sharkdp/hyperfine@v1.19.0' }

      - name: download ezno
        continue-on-error: true
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh run download -R kaleidawave/ezno --pattern binary-LinuxX64-general-fixes-last
          mv binary-LinuxX64-general-fixes-last/binary-LinuxX64-general-fixes-last ezno
          chmod +x ./ezno
          ./ezno --help

      - name: download typescript (JS + tsgo)
        continue-on-error: true
        run: npm install typescript && npm install @typescript/native-preview-linux-x64

      - name: Get latest version of demo.tsx
        run: curl https://gist.githubusercontent.com/kaleidawave/81066f322ed574b3373e27770137013f/raw/b04dcc0bc60e6331008bdd578b98224cc07d5d42/all.tsx > demo.tsx

      - name: file 10
        shell: shell-language {0}
        run: |
          let large = read "./demo.tsx" then repeat 10
          write "./large.tsx" $large

      - name: ezno (demo.tsx)
        continue-on-error: true
        run: ./ezno check demo.tsx --timings

      - name: ezno (large.tsx)
        continue-on-error: true
        run: ./ezno check large.tsx --timings

      - name: typescript (demo.tsx)
        continue-on-error: true
        run: node ./node_modules/typescript/lib/_tsc.js --noEmit --jsx preserve --skipLibCheck --diagnostics demo.tsx

      - name: typescript (large.tsx)
        continue-on-error: true
        run: node ./node_modules/typescript/lib/_tsc.js --noEmit --jsx preserve --skipLibCheck --diagnostics demo.tsx

      - name: tsgo (demo.tsx)
        continue-on-error: true
        run: ./node_modules/@typescript/native-preview-linux-x64/lib/tsgo --noEmit --jsx preserve --skipLibCheck --diagnostics demo.tsx

      - name: tsgo (large.tsx)
        continue-on-error: true
        run: ./node_modules/@typescript/native-preview-linux-x64/lib/tsgo --noEmit --jsx preserve --skipLibCheck --diagnostics large.tsx
        
      - name: run performance test (demo.tsx)
        continue-on-error: true
        run: |
          hyperfine -N -i './ezno check demo.tsx' './node_modules/@typescript/native-preview-linux-x64/lib/tsgo --noEmit --jsx preserve --skipLibCheck demo.tsx' 'node ./node_modules/typescript/lib/_tsc.js --noEmit --jsx preserve --skipLibCheck demo.tsx'

      - name: run performance test (large.tsx)
        continue-on-error: true
        run: |
          hyperfine -N -i './ezno check large.tsx' './node_modules/@typescript/native-preview-linux-x64/lib/tsgo --noEmit --jsx preserve --skipLibCheck large.tsx' 'node ./node_modules/typescript/lib/_tsc.js --noEmit --jsx preserve --skipLibCheck large.tsx'

  sde-linux:
    if: false

    runs-on: ubuntu-latest
    
    defaults:
      run:
        shell: bash

    steps:
      - name: Setup SDE binaries
        uses: petarpetrovt/setup-sde@v3.0
        with:
          environmentVariableName: SDE_PATH # default value is `SDE_PATH`
          sdeVersion: 9.58.0 # possible values: 9.58.0 (default), 9.33.0

      - name: fix
        run: echo "$SDE_PATH" >> $GITHUB_PATH

      - name: run1
        continue-on-error: true
        run: sde --help

      - name: Download binaries 1
        uses: kaleidawave/release-downloader@improvements
        with:
          items: kaleidawave/experiments@assets[format-number]

      - name: run2
        continue-on-error: true
        run: |
          sde -mix -mix_filter_no_shared_libs -- format-number 42 --english
          sde -omix out1.txt -mix_filter_no_shared_libs -- format-number 42 --english

      - name: run2.1
        continue-on-error: true
        run: | 
          ls
          cat out1.txt

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out1.txt
          retention-days: 7

      - uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: ripgrep

      - name: run3
        run: rg --help

      - name: run4
        continue-on-error: true
        run: |
          sde -omix out2.txt -mix_filter_no_shared_libs -- format-number 42 --english
          cat out2.txt | rg -e "\*total" | last

  test-release-downloader-action-reference:
    if: false

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      GH_TOKEN: ${{ github.token }}
    
    steps:
    - name: Download binaries 1
      uses: kaleidawave/release-downloader@improvements
      with:
        items: kaleidawave/experiments@assets[format-number|parse-number|spectra]

    - name: run output
      run: |
        format-number --help
        parse-number --help
        format-number 42 --english
        parse-number 'fourty two' --english 
        spectra --help
        which 'spectra'

  lines-of-code-on-ezno:
    if: false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        repository: kaleidawave/ezno
    - name: Download binaries 1
      uses: kaleidawave/release-downloader@improvements
      with:
        items: kaleidawave/experiments@assets[lines-of-code]
        trace: true

    - name: lines of code in Ezno
      run: | 
        lines-of-code checker/**/*.rs
        lines-of-code parser/**/*.rs

  test-mkdir-on-windows-bash:
    if: false

    runs-on: windows-latest

    steps:
    - name: run 1
      shell: bash
      continue-on-error: true
      run: |
        mkdir -p "$HOME/test1"
        ls $HOME

    - name: run 2
      shell: bash
      continue-on-error: true
      run: |
        echo "hi" > "$HOME/test2/file1"
        ls $HOME
        ls '$HOME/test2'
        cat '$HOME/test2/file1'

  build-exe-parser:
    if: false
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        repository: N0fix/rpecli
    - uses: dtolnay/rust-toolchain@stable

    - name: Build
      run: cargo build --bin rpecli

    - id: upload
      uses: actions/upload-artifact@v4
      with:
        name: result
        path: target/debug/**/*.exe
        retention-days: 3

  release-download1:
    if: false

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - id: run
      run: |
        IFS=',' read -ra entries <<< 'kaleidawave/experiments@assets[spectra],sharkdp/hyperfine@v1.19.0[hyperfine]'
        # IFS=',' read -ra entries <<< '$ { { inputs.items }}'

        BIN="$HOME/.local/bin"
        mkdir -p "$BIN"

        ls -R "$HOME/.local"

        # Loop through each entry
        for entry in "${entries[@]}"; do
          # Extract owner and the rest
          owner="${entry%%/*}"
          rest="${entry#*/}"

          # Extract repository and the rest
          repository="${rest%%@*}"
          rest="${rest#*@}"

          # Extract version and item
          version="${rest%%[*}"
          item="${rest#*[}"
          item="${item%]}"  # remove trailing ]

          echo "$owner/$repository @ $version get item $item"

          gh release download -R "$owner/$repository" $version -p $item -D $BIN
        done

        gunzip "$BIN/**/*.gz"
        tar -xf "$BIN/**/*.tar" -C $BIN --strip-components 1 --overwrite

        for file in "$BIN/**/*"; do
          echo "$file"
          if [ -f "$file" ]; then 
            if head -c 4 "$file" | grep -q $'\x7fELF'; then
              chmod +x "$file"
            fi
          fi
        done

        echo "$BIN" >> "$GITHUB_PATH"
      shell: bash

    # test
    - uses: actions/checkout@v4
      with:
        repository: kaleidawave/experiments
        ref: general-parser
    - uses: dtolnay/rust-toolchain@stable

    - name: Test
      run: cargo test
      working-directory: general-parser

    - name: hypefine
      run: hypefine --help

    - name: git
      run: git diff

  test-version-thingy:
    if: false

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v4
      with:
        repository: kaleidawave/experiments
        ref: general-parser

    - uses: kaleidawave/release-downloader@main
      with:
        items: kaleidawave/crates-release-gh-action@assets[crates-release]

    - name: Update versions
      id: update-versions
      run: crates-release change-version patch --github-actions-outputs
      working-directory: general-parser

    - run: echo '${{ toJson(steps.update-versions.outputs) }}'
    - run: git diff

