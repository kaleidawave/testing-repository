name: Performance (ezno)

on:
  push

jobs:
  flamegraph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/checkout@v3
        with:
          repository: 'kaleidawave/ezno'
          path: ezno
      - uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: flamegraph hyperfine

      - name: Cache Ezno target
        id: cache-ezno
        uses: actions/cache@v3
        with:
          path: ezno/target
          key: ${{ runner.os }}-ezno

      - name: Build Ezno
        run: cargo build --release
        working-directory: ezno
        env:
          CARGO_PROFILE_RELEASE_DEBUG: true

      - name: Run hyperfine
        run: hyperfine './target/release/ezno build ../one-off/ezno/index.js'
        working-directory: ezno

      - name: Run hyperfine again
        run: hyperfine './target/release/ezno build ../one-off/ezno/index.js' >> $GITHUB_STEP_SUMMARY
        working-directory: ezno
        
      - name: Setup
        run: |
          echo "commit ${{ github.event.head_commit.id }} (${{ github.event.head_commit.message }}) " >> $GITHUB_STEP_SUMMARY
          echo "# Output" >> $GITHUB_STEP_SUMMARY
          ./target/release/ezno info >> $GITHUB_STEP_SUMMARY
        working-directory: ezno

      - name: Run flamegraph
        continue-on-error: true
        run: |
          # Raise privilege for flamegraph
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid

          cargo flamegraph -c "record -e instructions -c 100 --call-graph lbr -g" -- build ../one-off/ezno/index.js

          flamegraph -o my_flamegraph.svg -- ./target/release/ezno build ../one-off/ezno/index.js
          cat my_flamegraph.svg >> $GITHUB_STEP_SUMMARY
        working-directory: ezno
        env:
          CARGO_PROFILE_RELEASE_DEBUG: true
