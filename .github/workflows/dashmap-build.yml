name: Dashmap build

on:
  push:
    paths:
      - "dashmap-testing/**"
      - ".github/workflows/dashmap-build.yml"

jobs:
  main:
    strategy:
      matrix:
        version: [1.58, 1.59, 1.60, 1.61, 1.62.1]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust ${{ matrix.version }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.version }}
          override: true
      - run: cargo run
        working-directory: dashmap-testing