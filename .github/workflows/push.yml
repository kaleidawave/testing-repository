name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off"

jobs:
  download-ezno:
    runs-on: ubuntu-latest
    if: true
    steps:
      - uses: kaleidawave/release-downloader@add-rename-and-path-env
        with:
          repository: 'kaleidawave/ezno'
          addToPath: true
          latest: true
          out-file-path: ezno-binary
          fileName: '*-linux'

      - run: ezno info

  download-hyperfine:
    runs-on: ubuntu-latest
    if: true
    env:
      ACTIONS_STEP_DEBUG: true
    steps:
      - uses: kaleidawave/release-downloader@add-rename-and-path-env
        with:
          repository: 'sharkdp/hyperfine'
          addToPath: true
          latest: true
          out-file-path: hyperfine-binary
          fileName: '*-x86_64-unknown-linux-gnu*'
          extract: true

      - run: file $(which hyperfine)
      - run: ls $(dirname $(which hyperfine))
      - run: which hyperfine | xargs dirname | xargs ls
      - run: which hyperfine | xargs dirname | xargs ls -l
      - run: hyperfine --help

  run-ezno-fuzzing:
    runs-on: ubuntu-latest
    if: false
    strategy:
      fail-fast: false
      matrix:
        with_locked: [true, false]
        
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install latest nightly and set it as default
        run: |
          rustup install nightly
          rustup default nightly

      # - uses: brndnmtthws/rust-action-cargo-binstall@v1
      #   if: ${{ matrix.with_binstall }}
      #   with:
      #     packages: cargo-fuzz

      - run: cargo install --git https://github.com/rust-fuzz/cargo-fuzz.git --locked
        if: ${{ matrix.with_locked }}

      - run: cargo install --git https://github.com/rust-fuzz/cargo-fuzz.git
        if: ${{ !matrix.with_locked }}

      - run: |
          git clone https://github.com/kaleidawave/ezno.git .
          cd parser/fuzz
          cargo fuzz run -s none module_roundtrip_naive -- -timeout=10 -use_value_profile=1 -max_total_time=10

  test-difference-in-cargo-fuzz:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone
        run: |
          git clone https://github.com/rust-fuzz/cargo-fuzz.git main
          git clone -b default-target https://github.com/taiki-e/cargo-fuzz.git feature

      - name: main
        run: cargo clean && time cargo build
        working-directory: main

      - name: feature
        run: cargo clean && time cargo build
        working-directory: feature

  time-ezno-debug-and-does-cli-have-an-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Clone repository
        run: |
          git clone https://github.com/kaleidawave/ezno ezno

      - name: Check build timings
        run: |
          cat ../one-off/ezno/removed.diff

          cargo clean
          cargo build --bin ezno

          git apply ../one-off/ezno/removed.diff

          cargo clean
          cargo build --bin ezno
          
          git reset --hard
          
          cargo clean
          cargo build --bin ezno
        working-directory: ezno
      - name: Update
        run: |
          ./target/debug/ezno info
          
          ./target/debug/ezno experimental upgrade
          
          ./target/debug/ezno info
        working-directory: ezno

  get-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: false
    steps:
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.0
      - name: Clone & compile
        run: |
          git clone https://github.com/facebook/flow flow
          
          cd flow
          ls

          opam --version
          
          # Install dependencies
          make deps
          eval $(opam env)

          opam install -y js_of_ocaml.5.5.2
          eval $(opam env)

          # Build JS
          make js

          ls bin
          
      - uses: actions/upload-artifact@v4
        with:
          name: flow-build
          path: flow/bin
          if-no-files-found: error
          retention-days: 1
