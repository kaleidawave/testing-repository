name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  type_sizes:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaleidawave/ezno
          ref: general-fixes
          path: ezno
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Count sizes
        run: |
          RUSTFLAGS=-Zprint-type-sizes cargo +nightly build --release -p ezno-parser
          RUSTFLAGS=-Zprint-type-sizes cargo +nightly build --release -p ezno-checker
        working-directory: ezno
   
  github_file_annotation:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run run.ts
        working-directory: one-off/github-file-annotations

  bash_on_windows:
    if: true

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # TODO experiment with some date flags here
      - name: Specified shell
        run: ls -l
        continue-on-error: true
        shell: bash

      - name: Unspecified shell
        run: ls -l
        continue-on-error: true