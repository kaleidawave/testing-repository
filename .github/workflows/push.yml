name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  start_discussion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            const query = `mutation($repositoryId:String!,$body:String!,$title:String!) {
              # input type: CreateDiscussionInput
              createDiscussion(input: {repositoryId: $repositoryId, categoryId: "5678", body: $body, title: $title}) {

                # response type: CreateDiscussionPayload
                discussion {
                  id
                }
              }
            }`;
            const variables = {
              repositoryId: 'R_kgDOHITK2Q',
              title: 'Hello World',
              body: 'Discussion',
            }
            const result = await github.graphql(query, variables)
            console.log(result)
  