name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off"

jobs:
  # Because of a current problem with the GitHub website
  download_typescript_files:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
      - uses: actions/upload-artifact@v4
        with:
          name: TSC files
          path: |
            src/compiler/checker.ts
            src/compiler/parser.ts
          retention-days: 14

  call-workflow-passing-data:
    uses: ./.github/workflows/reusable.yml
    if: false
    with:
      something: test

  ezno-build-with-info:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaleidwave/ezno
          ref: origin/cli-and-ci-improvements-and-others
          fetch-tags: true

      - name: Get version
        id: get-version
        run: |
          # if [ $#{{ inputs.ezno-version }} = 'latest' ]; then
            echo "::group::Ezno tags"
            git for-each-ref --sort=creatordate --format '%(refname:short)' 'refs/tags/release/ezno-[0-9]*'
            echo "::endgroup::"

            TAG=$(git for-each-ref --sort=creatordate --format '%(refname:short)' 'refs/tags/release/ezno-[0-9]*' | tail -n 1 | cut -c 14-)

            echo "::debug::Releasing with found version $TAG"
            echo "LATEST_EZNO_VERSION=${TAG}" >> "$GITHUB_OUTPUT"
            echo "LATEST_EZNO_VERSION_DASH=${TAG//./-}" >> "$GITHUB_OUTPUT"
          # else
          #   TAG="$#{{ inputs.ezno-version }}"

          #   echo "::debug::Releasing with specific version $TAG"
          #   echo "LATEST_EZNO_VERSION=${TAG}" >> "$GITHUB_OUTPUT"
          #   echo "LATEST_EZNO_VERSION_DASH=${TAG//./-}" >> "$GITHUB_OUTPUT"
          # fi

      - id: get-sponsors-and-contributors
        run: |
          SPONSORS=$(gh api graphql -f query='{
            user(login: "kaleidawave") {
              sponsorshipsAsMaintainer(first: 100, activeOnly: false) {
                edges {
                  node {
                    sponsor {
                      name, login
                    }
                  }
                }
              }
            }
          }' -q '.data.user.sponsorshipsAsMaintainer.edges | map(.node.sponsor.name // .node.sponsor.login) | join(",")')

          CONTRIBUTORS=$(
            gh pr list --state merged --json author | jq 'map(.author.name // .author.login) | unique | join(",")' --raw-output
          )
            
          echo "SPONSORS=$SPONSORS" >> "$GITHUB_OUTPUT"
          echo "CONTRIBUTORS=$CONTRIBUTORS" >> "$GITHUB_OUTPUT"
          echo "::debug::CONTRIBUTORS=$CONTRIBUTORS and SPONSORS=$SPONSORS"

        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build binary
        run: cargo build
        env:
          SPONSORS: ${{ steps.get-sponsors-and-contributors.outputs.SPONSORS }}
          CONTRIBUTORS: ${{ steps.get-sponsors-and-contributors.outputs.CONTRIBUTORS }}

      - name: Rename and move release assets
        run: |
          mkdir artifacts
          # mv target/release/ezno$#{{ matrix.executable-extension }} "artifacts/ezno-$#{{ needs.get-build-info.outputs.LATEST_EZNO_VERSION_DASH }}-$#{{ matrix.platform_name }}$#{{ matrix.executable-extension }}"
          mv target/release/ezno.exe "artifacts/ezno-latest-window.exe

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-test
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1
      
  lean-4-ffi:
    if: true
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          repository: argumentcomputer/RustFFI.lean
          path: RustFFI
        
      - uses: leanprover/lean-action@v1
      - name: Run RustFFI
        run: lake exe ffi
        working-directory: RustFFI
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          repository: marcusrossel/lean-egg
          path: lean-egg

      - name: Run lean-egg
        run: lake build
        working-directory: lean-egg
        continue-on-error: true
  
  simd_example:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Build examples
        working-directory: one-off/simd_test
        run: RUSTC_BOOTSTRAP=1 cargo build --examples --release
        
      - uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: hyperfine

      - name: Get file
        working-directory: one-off/simd_test
        run: |
          curl https://esm.sh/v135/typescript@5.6.2/es2022/typescript.mjs > file
          cat file >> example
          cat file >> example
          cat file >> example
          cat file >> example
        
      - name: Run test
        working-directory: one-off/simd_test
        run: |
          target/release/examples/simd
          target/release/examples/non_simd
        
      - name: Run benchmark
        working-directory: one-off/simd_test
        run: hyperfine -L compiler 'simd,non_simd' 'target/release/examples/{compiler}' --warmup 15

  valgrind_example:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: sudo apt-get install valgrind

      - name: Build examples
        working-directory: one-off/memory_and_cpu_cycles
        run: |
          cargo build --examples

      - name: Run valgrind
        working-directory: one-off/memory_and_cpu_cycles
        if: false
        continue-on-error: true
        run: |
          valgrind --log-file=out-mem1.txt ./target/debug/examples/memory 100
          valgrind --log-file=out-mem2.txt ./target/debug/examples/memory 1000

          # Doesn't count `stack`. (not sure if there is a flag)
          # valgrind --log-file=out-stack-allocation.txt ./target/debug/examples/memory_stack

          # All works well
          # valgrind --log-file=out-mem3.txt ./target/debug/examples/memory 1000000
          # valgrind --log-file=out-mem4.txt ./target/debug/examples/memory 8000000
          # valgrind --log-file=out-leak.txt ./target/debug/examples/leak
          # valgrind --log-file=out-leak_string.txt ./target/debug/examples/leak_string

      - name: Run callgrind
        working-directory: one-off/memory_and_cpu_cycles
        continue-on-error: true
        run: |
          valgrind --tool=callgrind --callgrind-out-file=out-cpu1-1.txt ./target/debug/examples/cpu 1000
          valgrind --tool=callgrind --callgrind-out-file=out-cpu1-2.txt ./target/debug/examples/cpu 1000

          valgrind --tool=callgrind \
          --callgrind-out-file=out-cpu1-threads1-1.txt \
          ./target/debug/examples/cpu_threads 1000

          valgrind --tool=callgrind \
          --callgrind-out-file=out-cpu1-threads1-2.txt \
          ./target/debug/examples/cpu_threads 1000

      - name: Run callgrind (release)
        working-directory: one-off/memory_and_cpu_cycles
        continue-on-error: true
        run: |
          cargo build --release --example cpu; cargo build --release --example cpu_threads;

          valgrind --tool=callgrind --callgrind-out-file=out-cpu2-1.txt ./target/debug/examples/cpu 1000
          valgrind --tool=callgrind --callgrind-out-file=out-cpu2-2.txt ./target/debug/examples/cpu 1000

          valgrind --tool=callgrind \
          --callgrind-out-file=out-cpu2-threads1-1.txt \
          ./target/debug/examples/cpu_threads 1000

          valgrind --tool=callgrind \
          --callgrind-out-file=out-cpu2-threads1-2.txt \
          ./target/debug/examples/cpu_threads 1000

      - uses: actions/upload-artifact@v4
        with:
          name: Out files
          path: one-off/memory_and_cpu_cycles/out*.txt
          retention-days: 14

  valgrind_ezno:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get install valgrind

      - name: Setup
        run: |
           curl https://github.com/kaleidawave/ezno/releases/download/release%2Fezno-0.0.22/ezno-0.0.22-x86_64-unknown-linux -L -o ezno
           curl https://gist.githubusercontent.com/kaleidawave/c10ac35d841312b1c5c5da356cab13de/raw/d17a31bb3559fc9881ffc1b8f716f317bb0a1c04/example.tsx -o example.tsx
           chmod +x ./ezno

      - name: Run example
        run: ./ezno info

      - name: Run valgrind
        continue-on-error: true
        run: valgrind --log-file=out1.txt ./ezno check example.tsx

      - name: Run callgrind
        continue-on-error: true
        run: valgrind --tool=callgrind --callgrind-out-file=out2.txt ./ezno check example.tsx

      - uses: actions/upload-artifact@v4
        with:
          name: Out files
          path: out*.txt
          retention-days: 3

  ezno-tsc-check-perf:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install
        run: |
          npm -g install typescript
          curl https://github.com/kaleidawave/ezno/releases/download/release%2Fezno-0.0.22/ezno-0.0.22-x86_64-unknown-linux -L -o ezno
          curl https://gist.githubusercontent.com/kaleidawave/c10ac35d841312b1c5c5da356cab13de/raw/d17a31bb3559fc9881ffc1b8f716f317bb0a1c04/example.tsx -o one-off/example.tsx
          chmod +x ./ezno

      - name: Run
        run: |
          for i in {1..10}; do
            bun run ./one-off/tsc-perf-compare.ts
          done

  upload-artifacts:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Build
        run: mkdir src
        shell: bash

      - name: Build
        run: | 
          mkdir dist
          echo "Hello" > dist/file.txt
        working-directory: src
        shell: bash

      - name: Build 
        run: ls -R
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: a
          path: ./src/dist
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: b
          path: src/dist
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: c
          path: src
          retention-days: 3

  run-ezno-perf:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaleidawave/ezno
          ref: checker-improvements-036
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Ezno
        run: cargo build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: true
      - name: Run action
        run: |
          cargo run -p ezno-parser --example code_blocks_to_script ./checker/specification/specification.md --comment-headers --out ./demo.tsx

          echo "::group::File"
          cat demo.tsx
          echo "::endgroup::"

          command_output=$(./target/debug/ezno check demo.tsx --timings --max-diagnostics all 2>&1 || true)
          diagnostics=""; statistics=""; found_splitter=false;

          echo "::group::Ouput"
          echo $command_output
          echo "::endgroup::"

          while IFS= read -r line; do
              if [[ "$line" == "---"* ]]; then found_splitter=true;
              elif [[ "$found_splitter"  == false ]]; then diagnostics+="$line"$'\n';
              else statistics+="$line"$'\n'; fi
          done <<< "$command_output"

          echo "::group::Diagnostics"
          echo "Diagnostics: $diagnostics"
          echo "::endgroup::"

          echo "::group::Statistics"
          echo "Statistics: $statistics"
          echo "::endgroup::"

  download-ezno:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: kaleidawave/release-downloader@add-rename-and-path-env
        with:
          repository: 'kaleidawave/ezno'
          addToPath: true
          latest: true
          out-file-path: ezno-binary
          fileName: '*-linux'
      - run: ezno info

  download-hyperfine:
    runs-on: ubuntu-latest
    if: false
    env:
      ACTIONS_STEP_DEBUG: true
    steps:
      - uses: kaleidawave/release-downloader@add-rename-and-path-env
        with:
          repository: 'sharkdp/hyperfine'
          addToPath: true
          latest: true
          # out-file-path: hyperfine-binary
          fileName: '*-x86_64-unknown-linux-gnu*'
          extract: true

      # - run: file $(which hyperfine)
      # - run: which hyperfine | xargs dirname | xargs ls -l
      # - run: tar -xvzf $(which hyperfine)
      # - run: which hyperfine | xargs dirname | xargs ls -l
      - run: ls -l
      - run: find . | xargs file
      # - run: hyperfine --help

  run-ezno-fuzzing:
    runs-on: ubuntu-latest
    if: false
    strategy:
      fail-fast: false
      matrix:
        with_locked: [true, false]
        
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install latest nightly and set it as default
        run: |
          rustup install nightly
          rustup default nightly

      # - uses: brndnmtthws/rust-action-cargo-binstall@v1
      #   if: ${{ matrix.with_binstall }}
      #   with:
      #     packages: cargo-fuzz

      - run: cargo install --git https://github.com/rust-fuzz/cargo-fuzz.git --locked
        if: ${{ matrix.with_locked }}

      - run: cargo install --git https://github.com/rust-fuzz/cargo-fuzz.git
        if: ${{ !matrix.with_locked }}

      - run: |
          git clone https://github.com/kaleidawave/ezno.git .
          cd parser/fuzz
          cargo fuzz run -s none module_roundtrip_naive -- -timeout=10 -use_value_profile=1 -max_total_time=10

  test-difference-in-cargo-fuzz:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone
        run: |
          git clone https://github.com/rust-fuzz/cargo-fuzz.git main
          git clone -b default-target https://github.com/taiki-e/cargo-fuzz.git feature

      - name: main
        run: cargo clean && time cargo build
        working-directory: main

      - name: feature
        run: cargo clean && time cargo build
        working-directory: feature

  time-ezno-debug-and-does-cli-have-an-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Clone repository
        run: |
          git clone https://github.com/kaleidawave/ezno ezno

      - name: Check build timings
        run: |
          cat ../one-off/ezno/removed.diff

          cargo clean
          cargo build --bin ezno

          git apply ../one-off/ezno/removed.diff

          cargo clean
          cargo build --bin ezno
          
          git reset --hard
          
          cargo clean
          cargo build --bin ezno
        working-directory: ezno
      - name: Update
        run: |
          ./target/debug/ezno info
          
          ./target/debug/ezno experimental upgrade
          
          ./target/debug/ezno info
        working-directory: ezno

  get-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: false
    steps:
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.0
      - name: Clone & compile
        run: |
          git clone https://github.com/facebook/flow flow
          
          cd flow
          ls

          opam --version
          
          # Install dependencies
          make deps
          eval $(opam env)

          opam install -y js_of_ocaml.5.5.2
          eval $(opam env)

          # Build JS
          make js

          ls bin
          
      - uses: actions/upload-artifact@v4
        with:
          name: flow-build
          path: flow/bin
          if-no-files-found: error
          retention-days: 1
