          # curl -d '@Secrets.toml' https://test-logger-endpoint.kaleidawave.workers.dev/

  get_paths:
    runs-on: ubuntu-latest
    steps:
      - name: Do
        run: |
          gh release download v3.1.0 -R boyter/scc -p '*Linux_x86_64.tar.gz' -O scc.tar.gz
          gzip -d scc.tar.gz
          ls
        env:
          GH_TOKEN: ${{ github.token }}