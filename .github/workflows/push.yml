name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  download-binaries:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: kaleidawave/release-downloader@main
      with:
        items: kaleidawave/experiments@assets[shell-language],kaleidawave/experiments@assets[spectra]
      
    - name: Test 1
      run: spectra

    - name: Test 2
      run: shell-language

    - name: Test 3
      run: echo hi
      shell: shell-language {0}
