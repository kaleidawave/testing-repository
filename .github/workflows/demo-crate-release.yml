name: Demo crate release

on:
  push:
    paths:
      - "demo-crate-6154/**"
      - ".github/workflows/demo-crate-release.yml"

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Rust 1.50
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.59.0
          override: true
      - run: cargo check
        working-directory: demo-crate-6154
      - name: Crates publish
        uses: kaleidawave/crates-release-gh-action@main
        id: release
        with:
          version: minor
          crates-token: ${{ secrets.DEMO_CRATE_RELEASE_CRATES_TOKEN }}
          working-directory: demo-crate-6154
