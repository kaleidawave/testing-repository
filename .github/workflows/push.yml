name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  try_out_codespan_pr:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      matrix: 
        repository:
          # - dtolnay/cxx WORKS!
          # - gfx-rs/wgpu naga/src/error.rs:50:17 & naga/src/span.rs:330:20
          # - bevyengine/bevy WORKS!
          - EmbarkStudios/toml-span
          # - bevyengine/naga_oil src/compose/error.rs:295:20
        include:
          - repository: gfx-rs/wgpu
            path: naga
          - repository: bevyengine/bevy
            path: crates/bevy_render
          - repository: EmbarkStudios/toml-span
            path: toml-span
      fail-fast: false

    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}

      - run: echo "'${{ matrix.path }}'"

      - name: Run check that it works
        run: cargo locate-project
        working-directory: ${{ matrix.path }}

      - name: Update dependency
        run: cargo add codespan-reporting --git https://github.com/urisinger/codespan-style-writer.git --branch master
        working-directory: ${{ matrix.path }}

      - name: Run cargo tree
        run: cargo tree
        working-directory: ${{ matrix.path }}

      - name: Run check
        run: | 
          cargo check
          cargo check --examples
        working-directory: ${{ matrix.path }}
      