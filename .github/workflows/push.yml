name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  test_262:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash run.sh
        working-directory: one-off/test262
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: one-off/test262/out
          retention-days: 14
          
  github_file_annotation:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run run.ts
        working-directory: one-off/github-file-annotations

