name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  variables:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Working directory
        run: pwd

      - name: What is home?
        run: ls $HOME

      - name: Run 1
        id: run-1
        working-directory: one-off/github-actions-environment-variables
        run: cargo run

      - name: Run 2
        run: echo '${{ steps.run-1.outputs.hi }}'

      - name: Run 3
        working-directory: one-off/github-actions-environment-variables
        continue-on-error: true
        run: |
          mv target/debug/github-actions-environment-variables/main "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run 4
        continue-on-error: true
        run: main

      - name: Run 5
        run: ls
