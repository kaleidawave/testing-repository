name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  test_262_preview_for_ezno:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash run.sh
        working-directory: one-off/test262
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: one-off/test262/out
          retention-days: 14
          
  github_file_annotation:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run run.ts
        working-directory: one-off/github-file-annotations

  bash_on_windows:
    if: true

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Specified shell
        run: date
        continue-on-error: true
        shell: bash
        
      - name: Unspecified shell
        run: date
        continue-on-error: true