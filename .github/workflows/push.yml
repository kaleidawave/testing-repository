name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off"
jobs:
  get-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14
      - name: Clone & compile
        run: |
          git clone https://github.com/facebook/flow flow
          
          cd flow
          ls

          opam --version
          
          # Install dependencies
          make deps
          eval $(opam env)
          
          opam install -y js_of_ocaml.5.5.2
          eval $(opam env)

          # Build JS
          make js

          ls bin
          
      - uses: actions/upload-artifact@v4
        with:
          name: flow-build
          path: flow/bin
          if-no-files-found: error
          retention-days: 1
