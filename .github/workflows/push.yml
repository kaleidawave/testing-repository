name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  download-binaries:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: kaleidawave/release-downloader@main
      with:
        items: kaleidawave/experiments@assets[shell-language],kaleidawave/experiments@assets[spectra],sharkdp/hyperfine@v1.19.0[hyperfine-*x86*linux-gnu*]
      
    - name: Test 1
      run: spectra

    - name: Test 2
      run: shell-language

    - name: Test 3
      run: hyperfine --help

  get-valgrind:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Install valgrind
      run: |
        sudo apt-get update
        sudo apt-get install valgrind

    - name: Print path
      run: |
        which valgrind
        valgrind --help

    - id: get-file
      run: echo "valgrind=$(which valgrind)" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v4
      with:
        name: valgrind
        path: ${{ steps.get-file.outputs.valgrind }}
        retention-days: 3
