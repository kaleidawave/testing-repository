name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  publish-things:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        crate: [demo-crate-6154, demo-crate-6155, demo-crate-6156]

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Crates publish
        uses: kaleidawave/crates-release-gh-action@improvements
        id: release
        with:
          version: patch
          crates-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          working-directory: one-off/${{ matrix.crate }}

    outputs:
      out: ${{ steps.release.outputs.new-versions-description }}

  finish:
    needs: publish-things
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add .
          git commit -m "Releases: ${{ toJson(needs.publish-things.outputs.out) }}"
          git push origin ${{ steps.checkout.outputs.ref }}
