      #   continue-on-error: true
      #   run: |
      #     CORPUS_URL="https://gist.githubusercontent.com/kaleidawave/6708f604bc403021b56cb54ea50cac62/raw/javascript_files.txt"

      #     curl -s "$CORPUS_URL" | while IFS= read -r URL; do
      #       FILENAME="${URL##*/}"
      #       curl -s "$URL" > $FILENAME
      #       echo "::group::Comparison"
