name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  download-binaries:
    runs-on: ubuntu-latest

    if: false

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: kaleidawave/release-downloader@improvements
      with:
        items: kaleidawave/experiments@assets[shell-language],kaleidawave/experiments@assets[spectra],sharkdp/hyperfine@v1.19.0[hyperfine-*x86*linux-gnu*]
      
    - name: Test 1
      run: spectra

    - name: Test 2
      run: shell-language

    - name: Test 3
      run: hyperfine --help

  get-valgrind:
    runs-on: ubuntu-latest

    if: false

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Install valgrind
      run: |
        sudo apt-get update
        sudo apt-get install valgrind

    - name: Print path
      if: false
      continue-on-error: true
      run: |
        which valgrind
        valgrind --help
        ls "$(dirname $(which valgrind))"
        file $(which valgrind)

    - id: get-file
      run: echo "valgrind=$(which valgrind).bin" >> $GITHUB_OUTPUT

    - id: echo-run-id
      run: echo "::notice::$(cat ${{ runner.temp }}) @ ${{ github.run_id }}"

    - uses: actions/upload-artifact@v4
      with:
        name: valgrind
        path: ${{ steps.get-file.outputs.valgrind }}
        retention-days: 1

  run-valgrind:
    runs-on: ubuntu-latest
    needs: get-valgrind

    if: ${{ always() }}

    steps:
      - uses : actions/download-artifact@v4
        with:
          run-id: 16326197118
          name: valgrind
          path: out
          github-token: ${{ github.token }}

      - name: Setup
        run: |
          ls out
          mv out/valgrind.bin out/valgrind
          echo "$(pwd)/out" >> "$GITHUB_PATH"
          ls out

      - name: Run 1
        continue-on-error: true  
        run: |
          ./valgrind --tool=callgrind ./valgrind --help
          ./valgrind ./valgrind --help

      - name: Run 2
        continue-on-error: true  
        run: |
          valgrind --tool=callgrind valgrind --help
          valgrind valgrind --help
