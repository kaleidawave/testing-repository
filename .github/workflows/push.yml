name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  type_sizes:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kaleidawave/ezno
          ref: general-fixes
          path: ezno

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: top-type-sizes

      - name: Run type sizes
        working-directory: ezno
        run: |
          RUSTFLAGS=-Zprint-type-sizes cargo +nightly build -j 1 > type-sizes.txt
          top-type-sizes < type-sizes.txt >> out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: type-sizes
          path: ezno/out.txt
          retention-days: 7
 
  data_across_jobs:
    if: true
    runs-on: ubuntu-latest
    steps:
      - id: step1
        run: |
          data='something
          here
          across
          multiple
          lines
          with lots of data
          kjasiodjiasoj
          iahwiudiwjdo
          kajisdjiawjsd
          data here
          and here'
          echo "data=$(echo -n "$data" | base64 --wrap=0)" >> "$GITHUB_OUTPUT"
      - id: step2
        env:
          data: ${{ steps.step1.outputs.data }}
        run: |
          echo "Here! Across a job. $(echo $data | base64 --decode)"
   
  github_file_annotation:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run run.ts
        working-directory: one-off/github-file-annotations

  bash_on_windows:
    if: false

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # TODO experiment with some date flags here
      - name: Specified shell
        run: ls -l
        continue-on-error: true
        shell: bash

      - name: Unspecified shell
        run: ls -l
        continue-on-error: true