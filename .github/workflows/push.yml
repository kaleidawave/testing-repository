name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  publish-things:
    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Crates publish 1
        uses: kaleidawave/crates-release-gh-action@improvements
        with:
          version: patch
          crates-token: ${{ steps.auth.outputs.token }}
          working-directory: one-off/demo-crate-6154

      - name: Crates publish 2
        uses: kaleidawave/crates-release-gh-action@improvements
        with:
          version: patch
          crates-token: ${{ steps.auth.outputs.token }}
          working-directory: one-off/demo-crate-6155

      - name: Crates publish 3
        uses: kaleidawave/crates-release-gh-action@improvements
        with:
          version: patch
          crates-token: ${{ steps.auth.outputs.token }}
          working-directory: one-off/demo-crate-6156

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add .
          git commit -m "Update `Cargo.toml`s"
          git push origin ${{ steps.checkout.outputs.ref }}
