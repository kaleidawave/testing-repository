name: Testing things

on:
  push

jobs:
  what_cpu:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: cat /proc/cpuinfo

  create_and_send_secrets:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Add secrets
        run: |
          # Generate Secrets file
          echo 'TEST_PRIVATE_KEY="${{ secrets.TEST_PRIVATE_KEY }}"' >> Secrets.toml
          echo 'Something else\n' >> Secrets.toml
          echo 'On a new line?' >> Secrets.toml
          # Post results
          # curl -d 'Hello from here' https://test-logger-endpoint.kaleidawave.workers.dev/
          # curl -d '@Secrets.toml' https://test-logger-endpoint.kaleidawave.workers.dev/

  look_at_repo:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Get private repo
        run: git clone "https://x-access-token:$GH_TOKEN@github.com/kaleidawave/ezno-private.git" ezno
        env:
          GH_TOKEN: ${{ secrets.GH_PRIVATE_REPO_KEY }}
      - name: Get scc
        run: |
          mkdir scc
          cd scc
          gh release download v3.1.0 -R boyter/scc -p '*Linux_x86_64.tar.gz' -O scc.tar.gz
          tar -xf scc.tar.gz
          chmod +x scc
          pwd >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run scc
        run: |
          scc -i rs ezno
          scc -c --no-cocomo -f json -i rs ezno | jq '.[] | .Code'
      - name: Look at ezno
        run: |
          # cd ezno
          git clone https://github.com/kaleidawave/self-rust-tokenize
          cd self-rust-tokenize

          cargo metadata --format-version 1 | jq -r ".workspace_members[]" | while read -r name version pathInfo ; do
              linesOfRustCode=$(scc -c --no-cocomo -f json -i rs ${pathInfo:13:-1} | jq '.[] | .Code');

              curl \
                --header "Content-Type: application/json" \
                --header "X-POST-ACCESS-KEY: ${{ secrets.PROJECTS_POST_ACCESS_KEY }}" \
                --data "{\"project\":\"$name\",\"language\":\"rust\",\"loc\":$linesOfRustCode}" \
                -w "Updated-project: \n" \
                https://projects.kaleidawave.workers.dev/update-project;

              echo "\`$name\` has $linesOfRustCode lines of code" >> $GITHUB_STEP_SUMMARY;
          done

  update_tomls:
    runs-on: ubuntu-latest
    if: true
    steps:
      - name: Get repo
        run: git clone https://github.com/kaleidawave/enum-variants-strings evt
      - name: Install dependencies (pip)
        run: pip install tomlkit==0.11.6 semver==2.13.0
      - name: Run script
        run: |
          from os import environ
          from tomlkit import dumps, parse
          from glob import glob
          from os import path
          from semver import bump_major, bump_minor, bump_patch, VersionInfo
          from json import loads as json_parse

          cargo_tomls = [path for path in glob("**/Cargo.toml", recursive=True) if not path.startswith("target")]

          upgraded_crates, manifest_cache = set(), dict()

          def toml_to_dict(path, cache):
            if path in cache:
              return cache[path]
            with open(path, "r") as f:
              toml = parse(f.read())
              cache[path]=toml
              f.close()
              return toml

          def try_get_name(toml):
            try:
              return toml["package"]["name"]
            except:
              return None

          def try_get_version(toml):
            try:
              return toml["package"]["version"]
            except:
              return None

          def bump_version(version, behavior):
            match behavior:
              case "patch":
                return bump_patch(version)
              case "minor":
                return bump_minor(version)
              case "major":
                return bump_major(version)
              case _:
                raise ValueError(f"Expected 'patch', 'minor' or 'major'. Found '{behavior}'")

          def write(path, toml):
            with open(path, "w") as f:
              f.write(dumps(toml))
              f.close()

          arguments = json_parse(environ['INPUT'])
          for crate_name, argument in arguments.items():
            if argument is None:
              continue

            path_finder = (path for path in cargo_tomls if try_get_name(toml_to_dict(path, manifest_cache)) == crate_name)

            try:
              crate_manifest_path = next(path_finder)
            except StopIteration:
              raise ValueError(f"Could not find a crate with name '{crate_name}'") from None

            crate_cargo_toml = toml_to_dict(crate_manifest_path, manifest_cache)

            if VersionInfo.isvalid(argument):
              new_version = argument
            else:
              new_version = bump_version(try_get_version(crate_cargo_toml), argument)
              
            crate_cargo_toml["package"]["version"] = new_version

            write(crate_manifest_path, crate_cargo_toml)

            for other_path in cargo_tomls:
                if other_path == crate_manifest_path:
                  continue

                other_manifest = toml_to_dict(other_path, manifest_cache)
                depenencies = other_manifest.get("dependencies", {}).values()
                for dependency in filter(lambda d: "path" in d, depenencies):
                  relative_path = path.normpath(path.join(path.dirname(crate_manifest_path), dependency["path"], "Cargo.toml"))
                  if relative_path == crate_manifest_path:
                    name = try_get_name(other_manifest)
                    if name not in arguments.keys():
                      parent_name = crate_cargo_toml["package"]["name"]
                      raise ValueError(f"'{name}' has updated dependency '{parent_name}' but it itself is not updated")

                    dependency["version"] = new_version

                    write(other_path, other_manifest)
        shell: python
        env:
          INPUT: '{"enum-variants-strings-derive": "minor", "enum-variants-strings": "minor"}'
          # INPUT: ${{ toJSON(value) }}
        working-directory: evt
      - name: diff
        run: git diff
        working-directory: evt