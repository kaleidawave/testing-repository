name: Rust http benchmark

on:
  push:
    paths:
      - "rust-http-benchmark/**"
      - ".github/workflows/test-benchmark.yml"

jobs:
  find-paths:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.read-change.outputs.paths }}
    steps:
      - uses: actions/checkout@v3
        with:
          # Needs two versions to tell difference in change
          fetch-depth: 2
      - name: Read changes
        id: read-change
        shell: bash
        run: |
          # "--no-renames --diff-filter=MCD" ensures only new or modified files. Its a bit weird
          changed_file_paths="$(git diff --no-renames --diff-filter=MCD --name-only HEAD HEAD~1)"
          readarray -t changed_file_paths_array <<< "$changed_file_paths"

          declare -A aa
          for element in "${changed_file_paths_array[@]}"
          do
            # "|| true" to prevent exiting if can't find match then don't exit code 1
            path=$(echo $element | grep -oP "(?<=rust-http-benchmark\/)[^\/]*" || true)
            if [ -n "$path" ]; then
              # enclose in quotes here
              aa["'$path'"]=1
            fi
          done

          # thanks https://stackoverflow.com/a/17841619/10048799
          function join_by {
            local d=${1-} f=${2-}
            if shift 2; then
              printf %s "$f" "${@/#/$d}"
            fi
          }

          items=$(join_by , ${!aa[@]})
          echo "::set-output name=paths::[$items]"

  run-benchmarks:
    needs: find-paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !contains(needs.find-paths.outputs.paths, '[]') }}
    strategy:
      fail-fast: false
      matrix: 
        path: ${{ fromJSON(needs.find-paths.outputs.paths) }}
    steps:
      - run: brew install wrk
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: ${{ format('rust-http-benchmark/{0}/target', matrix.path) }}
          key: ${{ runner.os }}-${{ format('rust-http-benchmark/{0}/Cargo.lock', matrix.path) }}
      - name: build
        run: |
          # TODO timings
          cargo build
        working-directory: ${{ format('rust-http-benchmark/{0}', matrix.path) }}
      - name: benchmark
        run: |
          # todo `debug` path
          ./target/debug/${{ matrix.path }} &
          # pause for server to startup
          sleep 10
          wrk -t12 -c200 -d30s http://127.0.0.1:3000
        working-directory: ${{ format('rust-http-benchmark/{0}', matrix.path) }}

      