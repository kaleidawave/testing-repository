name: Get video

on:
  push:
    paths:
      - ".github/workflows/get-video.yml"
      - "video/video-requests.txt"
      - "video/script.py"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup yt-dlp
        uses: AnimMouse/setup-yt-dlp@v1
        with:
          with-ffmpeg: true

      - name: Download and trim
        run: python script.py
        timeout-minutes: 60
        working-directory: video
        shell: bash

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: video
          path: |
            video
            !video/script.py
          retention-days: 3