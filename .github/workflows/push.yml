name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off"
jobs:
  le_specs:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: cat /proc/cpuinfo
      - run: pip list
      - run: rustc --version
      - run: yq --version

  printing_to_summary:
    runs-on: ubuntu-latest
    if: true
    steps:
      - run: |
          # echo "# Hello World \n # Something" >> $GITHUB_STEP_SUMMARY
          # echo -e "# Another \n # Thing" >> $GITHUB_STEP_SUMMARY

          echo "<details>
          <summary>Something</summary>

          ### Header
          
          \`\`\`ts
          const x = 2;
          \`\`\`

          *Final quote*
          
          </details>" >> $GITHUB_STEP_SUMMARY

          echo -e "end\n\nthanks for watching" >> $GITHUB_STEP_SUMMARY

  create_and_send_secrets:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Add secrets
        run: |
          # Generate Secrets file
          echo 'TEST_PRIVATE_KEY="${{ secrets.TEST_PRIVATE_KEY }}"' >> Secrets.toml
          echo 'Something else\n' >> Secrets.toml
          echo 'On a new line?' >> Secrets.toml
          # Post results
          # curl -d 'Hello from here' https://test-logger-endpoint.kaleidawave.workers.dev/
          # curl -d '@Secrets.toml' https://test-logger-endpoint.kaleidawave.workers.dev/

  look_at_repo:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Get private repo
        run: git clone "https://x-access-token:$GH_TOKEN@github.com/kaleidawave/ezno-private.git" ezno
        env:
          GH_TOKEN: ${{ secrets.GH_PRIVATE_REPO_KEY }}
      - name: Get scc
        run: |
          mkdir scc
          cd scc
          gh release download v3.1.0 -R boyter/scc -p '*Linux_x86_64.tar.gz' -O scc.tar.gz
          tar -xf scc.tar.gz
          chmod +x scc
          pwd >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run scc
        run: |
          scc -i rs ezno
          scc -c --no-cocomo -f json -i rs ezno | jq '.[] | .Code'
      - name: Look at ezno
        run: |
          # cd ezno
          git clone https://github.com/kaleidawave/self-rust-tokenize
          cd self-rust-tokenize

          cargo metadata --format-version 1 | jq -r ".workspace_members[]" | while read -r name version pathInfo ; do
              linesOfRustCode=$(scc -c --no-cocomo -f json -i rs ${pathInfo:13:-1} | jq '.[] | .Code');

              curl \
                --header "Content-Type: application/json" \
                --header "X-POST-ACCESS-KEY: ${{ secrets.PROJECTS_POST_ACCESS_KEY }}" \
                --data "{\"project\":\"$name\",\"language\":\"rust\",\"loc\":$linesOfRustCode}" \
                -w "Updated-project: \n" \
                https://projects.kaleidawave.workers.dev/update-project;

              echo "\`$name\` has $linesOfRustCode lines of code" >> $GITHUB_STEP_SUMMARY;
          done

  update_tomls:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v3
      - name: Get repo
        run: git clone https://github.com/kaleidawave/iterator-endiate temp-folder
      - name: Install dependencies (pip)
        run: pip install tomlkit==0.11.6 semver==2.13.0
      - name: Run script
        id: updator
        run: |
          # mv ../updator.py ./updator.py
          python ../one-off/updator.py
        shell: bash
        env:
          INPUT_VERSION: minor
        working-directory: temp-folder
      - name: diff
        run: git diff
        working-directory: temp-folder
      - name: Check output
        run: |
          echo ${{ steps.updator.outputs.NEW_VERSION_DESCRIPTION }}
          echo '${{ steps.updator.outputs.NEW_VERSION }}' | jq -r '.[]' | while read -r update; do
              echo $update
          done
          firstUpdateVersion=$(echo '${{ steps.updator.outputs.NEW_VERSION }}' | jq '.[0]')
          echo "Test: $firstUpdateVersion"
        shell: bash

  python_to_output:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: From Bash
        id: bash
        run: |
          echo "X=BRUH" >> $GITHUB_OUTPUT
        shell: bash
      - name: From Python
        id: python
        run: |
          import os

          print(os.environ["GITHUB_OUTPUT"])
          with open(os.environ["GITHUB_OUTPUT"], 'w') as f:
            print('Y=TEST', file=f)
            print('Z=TEST2', file=f)
        shell: python
      - name: Does it work
        run: |
          echo ${{ steps.bash.outputs.X }}
          echo ${{ steps.python.outputs.Y }}
          echo ${{ steps.python.outputs.Z }}
        shell: bash

  was_tha_command_line_input:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v3
      - name: Setup Random Variables
        id: variables
        run: |
          echo "X={\"a\": 1}" >> $GITHUB_OUTPUT
          echo "Y={\"a\": \"test\"}" >> $GITHUB_OUTPUT
          echo "Z={\"a\": [1, 2]}" >> $GITHUB_OUTPUT
        shell: bash
      - name: Test1
        run: python ./one-off/print-arguments.py '${{ steps.variables.outputs.X }}'
        shell: bash
      - name: Test2
        run: python ./one-off/print-arguments.py '${{ toJSON(steps.variables.outputs.Y) }}'
      - name: Test3
        run: python ./one-off/print-arguments.py '${{ toJSON(steps.variables.outputs) }}'
        shell: bash
      - name: Control
        run: |
          echo ${{ steps.variables.outputs.Z }}
          echo ${{ toJSON(steps.variables.outputs.Y) }}
          echo -e '${{ toJSON(steps.variables.outputs) }}'
        shell: bash

  json_null:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Setup
        run: |
          echo ${{ fromJSON('null') == null }}
        shell: bash

  update-json:
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Update manifest
        id: release
        run: |
          pip install tomlkit==0.11.6 semver==2.13.0
          curl https://raw.githubusercontent.com/kaleidawave/crates-release-gh-action/main/updater.py > updator.py

          python updator.py '{ "ezno": "0.2.0" }'
      - name: Install dependencies
        run: |
          rustup target add wasm32-unknown-unknown
          mkdir wasm-bindgen
          cd wasm-bindgen
          gh release download 0.2.84 -R rustwasm/wasm-bindgen -p '*x86_64-unknown-linux-musl.tar.gz' -O wasm-bindgen.tar.gz
          tar -xf wasm-bindgen.tar.gz
          mv wasm-bindgen-0.2.84-x86_64-unknown-linux-musl/wasm-bindgen wasm-bindgen
          pwd >> $GITHUB_PATH
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check outputs
        if: true
        run: |
          which wasm-bindgen
          echo ${{ steps.release.outputs.new-versions }}
          echo '${{ steps.release.outputs.new-versions-json-object }}'
          echo '${{ steps.release.outputs.new-versions-description }}'
        working-directory: src/js-cli-and-library

  release-copper:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v3
      - name: Set git credentials
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - name: Install packages and the vsce cli command
        run: |
          npm install
          npm install -g vsce
        working-directory: one-off/copper
      - name: Publish the extension pack
        run: |
          vsce publish -p ${{ secrets.VSCODE_MARKETPLACE_TOKEN }} patch
        working-directory: one-off/copper
      - name: Push back to repo
        run: |
          git status
          # git push --tags origin main

  rust-action-cargo-binstall:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: brndnmtthws/rust-action-cargo-binstall@v1
        with:
          packages: wasm-bindgen-cli@0.2.86
      - run: wasm-bindgen -V

  make-commit:
    runs-on: ubuntu-latest
    if: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set git credentials
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          echo ${{ github.event.commits.id }} >> commits.txt
          git add commits.txt
          git commit -m "From: ${{ github.event.commits.id }}"
          git push origin unmain

  get-stc:
    runs-on: windows-latest
    if: true
    steps:
      - name: Set git credentials
        run: |
          git clone https://github.com/dudykr/stc stc
          cd stc
          git reset --hard 693cf5a891c5580542811b906616f0c15d0dd0fc
          
          rustup toolchain install nightly-2023-06-20
          cargo +nightly-2023-06-20 build --release --manifest-path crates/stc/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: stc-build
          path: stc/target/release/stc.exe
          if-no-files-found: error
          retention-days: 1

  test-ytdlp:
    runs-on: ubuntu-latest
    if: false
    steps:
    - name: Setup yt-dlp
      uses: AnimMouse/setup-yt-dlp@v1
    - run: yt-dlp https://www.youtube.com/watch?v=ofnVlGln60M -o output.mp4 -f "best[ext=mp4][height<=720]"