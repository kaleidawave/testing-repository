name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  upload_and_download:
    runs-on: ubuntu-latest

    steps:
      - name: Create data
        run: |
          mkdir content123123
          cat "Hello World" > content123123/hello1.tsx

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}-1
          path: content123123

      - name: Create more data
        run: |
          rm content123123/hello1.tsx
          cat "Hello World" > content123123/hello2.tsx

      - name: Upload more data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}-2
          path: content123123
          
      - name: Clean
        run: |
          rm content123123/*
          ls -R .

      # ---

      - uses: actions/download-artifact@v4
        with:
          pattern: data-${{ github.run_id }}-*
          path: out
          merge-multiple: true

      - name: Clean
        run: |
          ls -R .
          echo "---"
          ls -R out

  try_out_codespan_pr:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      matrix: 
        repository:
          - dtolnay/cxx
          - gfx-rs/wgpu
          - bevyengine/bevy
        include:
          - repository: gfx-rs/wgpu
            path: naga
          - repository: bevyengine/bevy
            path: crates/bevy_render
      fail-fast: false

    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}

      - run: echo "'${{ matrix.path }}'"

      - name: Run check that it works
        run: cargo pkgid
        working-directory: ${{ matrix.path }}

      - name: Update dependency
        run: cargo add codespan-reporting --git https://github.com/urisinger/codespan-style-writer.git --branch master
        working-directory: ${{ matrix.path }}

      - name: Run cargo tree
        run: cargo tree
        working-directory: ${{ matrix.path }}

      - name: Run check
        run: cargo check --examples
        working-directory: ${{ matrix.path }}
      