name: Get video

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'YT URL'     
        required: true
      start:
        description: 'Start'
        required: false
      end:
        description: 'End'
        required: false
  push:
    branches: ['*']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install & setup
        run: |
          brew install yt-dlp/taps/yt-dlp
          brew install ffmpeg
          mkdir videos
      - name: Download
        run: |
          yt-dlp ${{ github.event.inputs.video }} --output videos/output.mp4
      - name: Trim
        if: ${{ github.event.inputs.start }}
        run: |
          ffmpeg -i videos/output.mp4 -ss ${{github.event.inputs.start}} -to ${{github.event.inputs.end}} -c:v copy -c:a copy videos/output.mp4
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: videos
          path: |
            videos