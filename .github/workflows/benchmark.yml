on:
  workflow_call:
    inputs:
      benchmarks:
        description: "paths to benchmarks, comma seperated"
        type: string
        required: true

jobs:
  run-benchmarks:
    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.benchmarks == '' }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(inputs.benchmarks) }}

    env:
      cache: true
      ARTIFACTS_FOLDER: artifacts

    defaults:
      run:
        shell: bash
        working-directory: benchmarks/${{ matrix.path }}

    steps:
      - uses: actions/checkout@v7

      - name: Get Date
        id: get-date
        run: echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_OUTPUT
        shell: bash

      - uses: actions/cache@v6
        if: env.cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/home/linuxbrew/
            **/target/release/*
            **/examples/*
            **/built/local/*
            **/Cargo.toml
          key: ${{ runner.os }}

      # - run: mkdir -p ${{ env.ARTIFACTS_FOLDER }}

      - name: Install hyperfine
        uses: kaleidawave/release-downloader@improvements
        with: { 'items': 'sharkdp/hyperfine@v2.0.0' }
        env: { GH_TOKEN: "${{ github.token }}" }

      - name: Run setup
        run: bash ./setup.sh
        # May need GH_TOKEN to download assets
        env: { GH_TOKEN: "${{ github.token }}" }
        timeout-minutes: 30

      - name: Run benchmark
        run: bash ./run.sh
        env: { ARTIFACTS_FOLDER: "${{ env.ARTIFACTS_FOLDER }}" }
        timeout-minutes: 10

      - name: Upload artifacts
        if: false
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: artifacts-${{ matrix.path }}
          # Does not respect 'working_directory'
          path: benchmarks/${{ matrix.path }}/${{ env.ARTIFACTS_FOLDER }}
