name: Testing things

on:
  push

jobs:
  read_repo_1:
    runs-on: ubuntu-latest
    steps:
      - run: echo Hi
      - name: Get private repo
        run: |
          # gh auth status
          # Cannot do this apparently
          # gh repo list kaleidawave
          
          gh repo clone kaleidawave/derive-finite-automaton derive-finite-automaton
          ls -R derive-finite-automaton

          gh repo clone kaleidawave/aoc20 aoc20
          ls -R aoc20
        env:
          GITHUB_TOKEN: ${{ secrets.TEST_PRIVATE_KEY }}
      - name: Get the lines of code.
        id: scc
        uses: iryanbell/scc-docker-action@v1.0.2
        with:
          args: ${{ env.workspace }} -i js,go,html,css

  read_repo_2:
