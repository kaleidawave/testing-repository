name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  upload_and_download:
    runs-on: ubuntu-latest

    steps:
      - name: Create data
        run: |
          mkdir content123123
          cat "Hello World" > content123123/hello1.tsx

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}-1
          path: content123123

      - name: Create more data
        run: |
          rm content123123/hello1.tsx
          cat "Hello World" > content123123/hello2.tsx

      - name: Upload more data
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}-2
          path: content123123
          
      - name: Clean
        run: |
          rm content123123/*
          ls -R .

      # ---

      - uses: actions/download-artifact@v4
        with:
          pattern: data-${{ github.run_id }}-*
          path: out
          merge-multiple: true

      - name: Clean
        run: |
          ls -R .
          echo "---"
          ls -R out
