name: Get video

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'YT URL'     
        required: true
      start:
        description: 'Start'
        required: false
      end:
        description: 'End'
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: echo Video is ${{ inputs.video }} 
      - name: Install & setup
        run: |
          brew install yt-dlp/taps/yt-dlp
          brew install ffmpeg
          mkdir videos
      - name: Download
        run: |
          yt-dlp ${{ inputs.video }} --output videos/output.mp4
      - name: Trim
        if: ${{ inputs.start }}
        run: |
          ffmpeg -i videos/output.mp4 -ss ${{ inputs.start }} -to ${{ inputs.end }} -c:v copy -c:a copy videos/output.mp4
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: videos
          path: |
            videos