name: GitHub Actions Demo

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          clean: false
      - name: Get latest cargo-edit version
        id: cargo-edit-version
        run:
          echo "::set-output name=CARGO_EDIT_API_RESPONSE::$( 
            curl https://formulae.brew.sh/api/formula/cargo-edit.json
          )"
        shell: bash
      - uses: actions/cache@v3
        id: cache-cargo-edit
        with:
          path: ~/home/linuxbrew/.linuxbrew/
          key: |
            ${{ runner.os }}-${{ fromJSON(steps.cargo-edit-version.outputs.CARGO_EDIT_API_RESPONSE).versions.stable }}
      - name: Install cargo edit
        if: steps.cache-cargo-edit.outputs.cache-hit != 'true'
        run: |
          echo "::group::Installing cargo edit"
          brew install cargo-edit
          echo "::endgroup::"
        shell: bash
      - name: Show cache hit
        if: steps.cache-cargo-edit.outputs.cache-hit == 'true'
        run: |
          echo "cache hit! :)"
          cargo set-version -V
        shell: bash
