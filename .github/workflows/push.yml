name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  download-binaries:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: kaleidawave/release-downloader@improvements
      with:
        items: kaleidawave/experiments@assets[shell-language],kaleidawave/experiments@assets[spectra],sharkdp/hyperfine@v1.19.0[hyperfine-*x86*linux-gnu*]
      
    - name: Test 1
      run: spectra

    - name: Test 2
      run: shell-language

    - name: Test 3
      run: hyperfine --help

  get-valgrind:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Install valgrind
      run: |
        sudo apt-get update
        sudo apt-get install valgrind

    - name: Print path
      if: false
      continue-on-error: true
      run: |
        which valgrind
        valgrind --help
        ls "$(dirname $(which valgrind))"
        file $(which valgrind)

    - id: get-file
      run: echo "valgrind=$(which valgrind).bin" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v4
      with:
        name: valgrind
        path: ${{ steps.get-file.outputs.valgrind }}
        retention-days: 1

  run-valgrind:
    runs-on: ubuntu-latest

    steps:
      - uses : actions/download-artifact@v4
        with:
          name: valgrind
          path: out

      - name: Run
        run: |
          ls out
          ren 'valgrind.bin' valgrind

          valgrind --tool=callgrind echo "Hi"

          valgrind echo "Hi"

