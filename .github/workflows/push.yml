name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off"
jobs:
  time-ezno-debug-and-does-cli-have-an-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: true
    steps:
      - uses: actions/checkout@v4
      - name: Clone repository
        run: |
          git clone https://github.com/kaleidawave/ezno ezno

      - name: Check build timings
        run: |
          cat ../one-off/ezno/removed.diff

          cargo clean
          cargo build --bin ezno

          git apply ../one-off/ezno/removed.diff

          cargo clean
          cargo build --bin ezno
          
          git reset --hard
          
          cargo clean
          cargo build --bin ezno
        working-directory: ezno
      - name: Update
        run: |
          ./target/debug/ezno info
          
          ./target/debug/ezno experimental upgrade
          
          ./target/debug/ezno info
        working-directory: ezno

  get-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: false
    steps:
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 4.14.0
      - name: Clone & compile
        run: |
          git clone https://github.com/facebook/flow flow
          
          cd flow
          ls

          opam --version
          
          # Install dependencies
          make deps
          eval $(opam env)

          opam install -y js_of_ocaml.5.5.2
          eval $(opam env)

          # Build JS
          make js

          ls bin
          
      - uses: actions/upload-artifact@v4
        with:
          name: flow-build
          path: flow/bin
          if-no-files-found: error
          retention-days: 1
