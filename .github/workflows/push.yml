name: Testing things

on:
  push:
    paths:
      - ".github/workflows/push.yml"
      - "one-off/**/*"

jobs:
  test-version-thingy:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
    - uses: actions/checkout@v4
      with:
        repository: kaleidawave/experiments
        ref: general-parser

    - uses: kaleidawave/release-downloader@main
      with:
        items: kaleidawave/crates-release-gh-action@assets[crates-release]

    - name: Update field
      id: update-field
      run: crates-release change-version patch
      working-directory: general-parser

    - run: echo ${{ toJson(steps.update-field.outputs) }}
