name: Get video

on:
  push:
    paths:
      - "video/video-requests.txt"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install & setup
        run: |
          brew install yt-dlp/taps/yt-dlp
          brew install ffmpeg
      - name: Download and trim
        run: |
          items=$(cat video-requests.txt | grep -v "^$")
          for i in ${!items[@]}; do
            item=${items[$i]}
            yt-dlp ${items[0]} -o output.mp4 -f mp4
            echo "Snipping out ${items[1]} to ${items[2]}"
            ffmpeg -i output.mp4 -ss "${items[1]}" -to "${items[2]}" -y cut-output.mp4
            rm output.mp4
            mv cut-output.mp4 "output-$i.mp4"
          done
        working-directory: video
        shell: bash
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: video
          path: |
            video